# A GitHub *issue form*, not a Markdown template.
#
# The Markdown template this replaces could be submitted with every heading
# still empty — which is how a report arrives with no version, no OS and no
# chip, and costs two round trips before anyone can read it. A form can require
# a field, and those three are the ones a report cannot be diagnosed without.
#
# Every `id` below is a query parameter name: Walder's Tray ▸ Report a bug…
# opens `issues/new?template=bug_report.yml&version=…&os=…&chip=…`, and an id
# renamed here silently drops that box's contents. Every prefilled field is a
# text field (`input` or `textarea`): GitHub does not select a dropdown from
# the URL. `src/core/bug-report.ts` names the same four ids, and
# `test/bug-report.test.ts` pins them and their types.
name: Bug report
description: Something Walder did that it should not have, or did not do that it should
title: 'Bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Tray ▸ **Report a bug…** in Walder opens this form with the version, the
        system and the diagnostics already filled in, and puts the same
        diagnostics on your clipboard. Filling it in by hand is fine — the three
        required boxes are short.

  - type: input
    id: version
    attributes:
      label: Walder version
      description: >-
        The Walder window (Tray ▸ Overview and settings…) shows it under its name.
      placeholder: 0.3.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: The name and the version — macOS 26.0, Windows 11 23H2.
      placeholder: macOS 26.0
    validations:
      required: true

  # A text box, not a dropdown: GitHub prefills a form from the URL only into
  # text fields, so a dropdown opened at "None" whatever Walder sent (Mac QA
  # 2026-11-19). Walder writes Apple Silicon, Intel or Windows x64 / arm64.
  - type: input
    id: chip
    attributes:
      label: Processor
      description: >-
        On a Mac, ▸ About This Mac: an "Apple M…" chip is Apple Silicon,
        anything else is Intel. On Windows, Settings ▸ System ▸ About ▸ System type.
      placeholder: Apple Silicon
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >-
        What you did, what Walder did, and what you expected instead. If you can
        make it happen again, say how.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Walder writes this block for you. If it is empty, Tray ▸ Report a bug…
        also copied it to your clipboard — paste it here.
      # `render: text` fences whatever lands here, typed or pasted. The first
      # test issue (2026-09-19) showed why a default `value` of an empty fence
      # was wrong: a hand-typed line ended up under an empty code block.
      render: text

  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: >-
        Optional, and often what settles it. Tray ▸ Reveal log file shows
        `walder.log`; you can drag the whole file into this issue instead.
        Walder strips logins and tokens from the log, but read what you paste.
      render: text
