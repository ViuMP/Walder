# Every issue on this repository is a bug report or translation feedback
# (translation.yml, 2026-11-19), so a form is not an option to skip past: a blank issue is how a report arrives
# with no version, no OS and no log, and then costs two round trips to become
# readable. Walder's own "Report a bug…" prefills the same fields, so the
# template and the menu item produce the same shape of report.
blank_issues_enabled: false
contact_links:
  - name: Report a security problem privately
    url: https://github.com/ViuMP/Walder/security/advisories/new
    about: Not as a public issue. See SECURITY.md.
