# Walder CI: type-check and unit tests on every pull request and every push to
# main, plus an unsigned installer per platform so a build failure shows up here
# rather than on the day someone tries to cut a release.
#
# WHY THE INSTALLERS DO NOT RUN ON EVERY PUSH (2026-09-20). GitHub bills a
# macOS runner minute at 10x and a Windows minute at 2x. One installer run was
# 30-70 billable minutes, it ran twice per PR branch (push and pull_request),
# and a docs-only commit paid the same — 2,330 of the plan's 3,000 minutes were
# gone in two days. So: the cheap check job runs on PRs and on main; the two
# installers run on a push to main that touched something an installer is
# made of, on a `v*` tag, and on demand. Docs never build an installer.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/dependabot.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/dependabot.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # No lifecycle scripts: the test suite never loads the Electron binary
      # (every src/main suite mocks the module, test/poller.test.ts included
      # since 2026-09-19), so there is no reason to pull ~130 MB down for a
      # type-check and a vitest run. ELECTRON_SKIP_BINARY_DOWNLOAD used to do
      # this and electron 44's install.js honours no such flag — the job kept
      # downloading, and failed outright when GitHub's release CDN answered
      # 500 (2026-09-19). The only scripts skipped are electron's download,
      # esbuild's binary check (its platform package is an optional dependency
      # npm installs regardless), and the two packagers' postinstalls, which
      # matter only to the installer jobs below. `electron.d.ts` ships in the
      # npm tarball, so the type-check needs nothing downloaded.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows installer
    runs-on: windows-latest
    # Not on pull requests: see the header. A PR still gets the check job.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # No ELECTRON_SKIP_BINARY_DOWNLOAD here: electron-builder packages the
      # runtime, so it has to be present.
      - run: npm ci

      # `dist:win` uses POSIX `VAR=x cmd` env-prefix syntax, which npm's
      # default Windows script shell (cmd.exe) cannot parse. windows-latest
      # ships Git for Windows, so point npm at its bash instead.
      - run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      # Its pre-hook renders the icons (the .icns step self-skips off macOS and
      # still writes icon.ico) and its post-hook runs check:asar.
      - run: npm run dist:win

      - uses: actions/upload-artifact@v7
        with:
          name: Walder-${{ github.sha }}-win
          path: release/*.exe
          if-no-files-found: error

      - name: Note the SmartScreen warning
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          **The Windows installer is unsigned.** SmartScreen will say
          "Windows protected your PC" the first time you run it. Choose
          **More info**, then **Run anyway**.
          EOF

  mac:
    name: macOS installer
    runs-on: macos-latest
    # Not on pull requests: see the header. A PR still gets the check job.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run dist:mac

      - uses: actions/upload-artifact@v7
        with:
          name: Walder-${{ github.sha }}-mac
          path: release/*.dmg
          if-no-files-found: error

      - name: Note the Gatekeeper block
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          **The dmg is ad-hoc signed**, which confers no trust: macOS will
          refuse to open Walder on first launch. See "Installing on a Mac" in
          the README for the way past it.
          EOF
