# Every issue on the releases repository is a bug report about the app, so the
# template is not an option to skip past: a blank issue is how a report arrives
# with no version, no OS and no log, and then costs two round trips to become
# readable. Walder's own "Report a bug…" prefills the same fields, so the
# template and the menu item produce the same shape of report.
blank_issues_enabled: false
