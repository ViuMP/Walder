<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP is injected by the `walder-csp` plugin in electron.vite.config.ts:
         production locks connect-src to 'none', dev allows the Vite HMR socket. -->
    <!--WALDER_CSP-->
    <title>Walder</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Everything except the dog's own pixels must be fully transparent, or
           the window would show a tinted rectangle over the desktop. */
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      #dog {
        display: block;
        /* Nearest-neighbour scaling: pixel art must stay hard-edged. */
        image-rendering: pixelated;
        -webkit-user-drag: none;
      }
      /*
       * The standard clip-rect trick, and specifically NOT `display: none`:
       * a hidden element is out of the accessibility tree entirely, so a live
       * region built that way announces nothing. This one is in the tree, one
       * device pixel across, and behind the transparent canvas of a window that
       * is click-through — there is nothing for a sighted owner to see or catch
       * a cursor on.
       */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="dog" role="img" aria-label="Walder"></canvas>
    <!-- What the dog is saying. `polite`, because a bark is never urgent
         enough to interrupt whatever the owner is having read to them. -->
    <div id="say" class="sr-only" aria-live="polite"></div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
