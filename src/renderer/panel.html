<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP is injected by the `walder-csp` plugin in electron.vite.config.ts. -->
    <!--WALDER_CSP-->
    <title>Walder — Usage</title>
    <style>
      /*
       * The hover panel, per design/HoverPanel.dc.html.
       *
       * Two deliberate departures from that file:
       *
       *  1. **No web fonts.** The design mocks up Silkscreen and VT323 from
       *     Google Fonts. The renderer's CSP allows no remote origin at all, and
       *     a mascot must not wait on a font CDN to draw a tooltip — so this uses
       *     the system monospace stack throughout, at sizes retuned for it (a
       *     system mono glyph is much larger than VT323 at the same px).
       *  2. **The card is semi-transparent** (alpha 0.82), which the owner asked
       *     for at the 2026-09-08 design gate: the panel sits over full-screen
       *     video, and an opaque card would punch a hole in it.
       *
       * `color-scheme: light` is set because this is a fixed, designed artefact:
       * the card is cream with near-black ink in every OS theme, and letting the
       * UA restyle anything under dark mode would fight the design.
       */
      :root {
        color-scheme: light;

        --card: rgba(251, 247, 238, 0.82);
        --ink: #22212a;
        --muted: #6b6660;
        --rule: #cfc8bb;
        --pct: #b8741f;

        /* Bar colours, straight from the design file. */
        --empty: #3d3b47;
        --green: #6dbf6a;
        --amber: #e2a53a;
        --red: #e0413f;
        --unknown: #8d8880;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      body {
        /* Room for the card's offset shadow, which is part of the design. */
        padding: 0 4px 4px 0;
        font:
          12px/1.35 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        color: var(--ink);
      }

      /*
       * Three card sizes, one stylesheet.
       *
       * `#card[data-size]` is written by the painter from the model's own
       * `size` (see `paint` in `panel.ts`), and everything that differs between
       * the layouts *visually* — how much padding, how much air between rows,
       * how big the row text is — is these three variable blocks. What differs
       * in *content* is not here at all: which lines exist is decided in
       * `core/card-layout.ts`, where it can be tested.
       *
       * Medium and Small are tighter as well as narrower on purpose. A card
       * with fewer lines but the same 12 px padding does not read as compact,
       * it reads as a card with something missing.
       */
      #card {
        box-sizing: border-box;
        width: 100%;
        background: var(--card);
        border: 3px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        display: flex;
        flex-direction: column;

        --pad: 12px;
        --gap: 10px;
        --rule-gap: 8px;

        padding: var(--pad);
        gap: var(--gap);
      }

      #card[data-size='medium'] {
        --pad: 10px;
        --gap: 8px;
      }

      #card[data-size='small'] {
        --pad: 8px;
        --gap: 4px;
        --rule-gap: 4px;
      }

      /* One service's lines. */
      .section {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      /*
       * The dashed rule that used to hang off the source line's `border-top`.
       *
       * It belongs to the *boundary*, not to the source line: Medium and Small
       * have no source line and still need the two services told apart. Applied
       * between sections, and under the header on Large — where the header is
       * followed by a section and the original design put a rule there too.
       */
      .head + .section,
      .section + .section {
        border-top: 2px dashed var(--rule);
        padding-top: var(--rule-gap);
      }

      .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }

      .title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      .ago {
        font-size: 10px;
        color: var(--muted);
      }

      /* `CLAUDE · via Claude Code login`. Large only. */
      .source {
        font-size: 9px;
        letter-spacing: 0.1em;
        color: var(--muted);
      }

      .note {
        font-size: 10px;
        line-height: 1.3;
        color: var(--muted);
      }

      .row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .rowhead {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        font-size: 12px;
      }

      /*
       * Small's rows are the whole card, so they are set one step down — 11 px
       * is what makes `7-day (all models)` and `100%` fit side by side at the
       * system mono font in the narrowest `CARD_WIDTH`.
       *
       * Small alone still ellipsises the Codex credit-limit row, and is meant
       * to: see the width table in `core/card-layout.ts`, which carries the
       * budget arithmetic this padding and this font size feed into.
       */
      #card[data-size='small'] .rowhead {
        font-size: 11px;
      }

      .label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .value {
        font-size: 11px;
        font-weight: 700;
        color: var(--pct);
        flex: none;
      }

      /*
       * The "(shared pool)" note on a derived row — see `bucketRow` in
       * `panel.ts`. Deliberately quiet: a footnote on the label rather than a
       * second label, so it takes the muted ink and the smaller size the
       * `resets` line already uses.
       */
      .shared {
        font-size: 9px;
        color: var(--muted);
      }

      /* 20 discrete segments — the pixel-art bar from the design. */
      .seg {
        display: grid;
        grid-template-columns: repeat(20, minmax(0, 1fr));
        gap: 2px;
        height: 10px;
      }

      .seg div {
        background: var(--empty);
        border: 1px solid var(--ink);
      }

      .seg div.on-low {
        background: var(--green);
      }
      .seg div.on-mid {
        background: var(--amber);
      }
      .seg div.on-high {
        background: var(--red);
      }
      .seg div.on-unknown {
        background: var(--unknown);
      }

      .resets {
        font-size: 10px;
        color: var(--muted);
      }

      /*
       * The age footer Medium and Small grow when — and only when — the age is
       * a problem (`compactFooter` in `core/card-layout.ts`). Muted and small:
       * it is a caveat about the numbers above it, not a number of its own.
       */
      .foot {
        font-size: 10px;
        color: var(--muted);
      }

      .stale {
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <!-- A landmark, so a reader can find the numbers rather than walking the
         whole window: this card is the only content there is. -->
    <div id="card" role="region" aria-label="Walder usage"></div>
    <script type="module" src="./panel.ts"></script>
  </body>
</html>
