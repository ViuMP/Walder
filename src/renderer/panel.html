<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP is injected by the `walder-csp` plugin in electron.vite.config.ts. -->
    <!--WALDER_CSP-->
    <title>Walder — Usage</title>
    <style>
      /*
       * The hover panel, per design/HoverPanel.dc.html.
       *
       * Three deliberate departures from that file:
       *
       *  1. **No web fonts.** The design mocks up Silkscreen and VT323 from
       *     Google Fonts. The renderer's CSP allows no remote origin at all, and
       *     a mascot must not wait on a font CDN to draw a tooltip — so this uses
       *     the system monospace stack throughout, at sizes retuned for it (a
       *     system mono glyph is much larger than VT323 at the same px).
       *  2. **The card is semi-transparent** (alpha 0.82), which the owner asked
       *     for at the 2026-09-08 design gate: the panel sits over full-screen
       *     video, and an opaque card would punch a hole in it.
       *  3. **Three text colours are darker than the design's** (audit F2, the
       *     owner's yes on 2026-11-14): `--muted`, `--pct` and the stale red.
       *     Departure 2 is why. The window is transparent with nothing of its
       *     own behind the card, so the text's real background is the cream at
       *     0.82 over whatever is on screen, and over black that is
       *     rgb(206, 203, 195), not the design's opaque cream. All of this
       *     text is 9 to 11 px, so WCAG AA asks 4.5:1 of it, and against that
       *     background the design's values gave 3.49, 2.32 and 2.58. Each is
       *     now the lightest 8-bit colour on its own hue and saturation that
       *     reaches 4.5:1 there (about 7:1 over a white desktop); black is the
       *     binding case because every one of them is dark text on a light
       *     card. `--ink` (9.79 over black) and every bar colour are untouched.
       *     Pinned by `test/panel-contrast.test.ts`.
       *
       * `color-scheme: light` is set because this is a fixed, designed artefact:
       * the card is cream with near-black ink in every OS theme, and letting the
       * UA restyle anything under dark mode would fight the design.
       */
      :root {
        color-scheme: light;

        --card: rgba(251, 247, 238, 0.82);
        --ink: #22212a;
        --muted: #5a5550; /* the design's #6b6660, darkened: departure 3 */
        --rule: #cfc8bb;
        --pct: #794c14; /* the design's #b8741f, darkened: departure 3 */
        /* The red of stale text. Its own property since 2026-11-14 so that
           `--red` below can stay the design's bar colour: as 10 px text that
           red was 2.58:1 (departure 3), as a bar segment it is not text. */
        --stale: #a81d1b;

        /* Bar colours, straight from the design file. */
        --empty: #3d3b47;
        --green: #6dbf6a;
        --amber: #e2a53a;
        --red: #e0413f;
        --unknown: #8d8880;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
        /*
         * Never a scrollbar (D2, 2026-11-14). The window is sized to the
         * measured card, but between a change and its measurement — a Card
         * size switch while the card is up, a SESSIONS row arriving — it is
         * the previous height for one IPC round trip. A scrollbar there is
         * worse than the clip it replaces: it is a control on a click-through
         * tooltip, and it paints ~17 px of track over the card's right edge.
         * Both axes: the card is laid out at its size's own width
         * (`cardBoxWidthFor`), not the window's, so whenever the window is
         * still the narrower one (the renderer hearing of a switch up from
         * Small before its viewport resize lands) the card overhangs it
         * sideways, which would be a horizontal scrollbar. Hidden, the
         * overhang is clipped until the window catches up.
         *
         * Nothing is lost by it: the window ignores the mouse entirely
         * (`setIgnoreMouseEvents(true)` in `hover-panel.ts`), so a card taller
         * than its window was never scrollable by anyone.
         */
        overflow: hidden;
      }

      body {
        /* Room for the card's offset shadow, which is part of the design. */
        padding: 0 4px 4px 0;
        font:
          12px/1.35 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        color: var(--ink);
      }

      /*
       * Three card sizes, one stylesheet.
       *
       * `#card[data-size]` is written by the painter from the model's own
       * `size` (see `paint` in `panel.ts`), and everything that differs between
       * the layouts *visually* — how much padding, how much air between rows,
       * how big the row text is — is these three variable blocks. What differs
       * in *content* is not here at all: which lines exist is decided in
       * `core/card-layout.ts`, where it can be tested.
       *
       * Medium and Small are tighter as well as narrower on purpose. A card
       * with fewer lines but the same 12 px padding does not read as compact,
       * it reads as a card with something missing.
       */
      #card {
        box-sizing: border-box;
        /* Only until the first paint: the painter then pins the width to the
           card size's own (`card.style.width` in `panel.ts`, D2 2026-11-14),
           so the measured height never depends on the window's width. */
        width: 100%;
        background: var(--card);
        border: 3px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        display: flex;
        flex-direction: column;

        --pad: 12px;
        --gap: 10px;
        --rule-gap: 8px;

        padding: var(--pad);
        gap: var(--gap);
      }

      #card[data-size='medium'] {
        --pad: 10px;
        --gap: 8px;
      }

      #card[data-size='small'] {
        --pad: 8px;
        --gap: 4px;
        --rule-gap: 4px;
      }

      /* One service's lines. */
      .section {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      /*
       * The dashed rule that used to hang off the source line's `border-top`.
       *
       * It belongs to the *boundary*, not to the source line: Medium and Small
       * have no source line and still need the two services told apart. Applied
       * between sections, and under the header on Large — where the header is
       * followed by a section and the original design put a rule there too.
       */
      .head + .section,
      .section + .section {
        border-top: 2px dashed var(--rule);
        padding-top: var(--rule-gap);
      }

      .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }

      .title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      .ago {
        font-size: 10px;
        color: var(--muted);
      }

      /* `CLAUDE · via Claude Code login`. Large only. */
      .source {
        font-size: 9px;
        letter-spacing: 0.1em;
        color: var(--muted);
      }

      .note {
        font-size: 10px;
        line-height: 1.3;
        color: var(--muted);
        /* An error note can carry a long slash-joined path with no space in it,
           which Chromium will not break, so it ran past the card edge
           (2026-11-13). The window height follows the measured card. */
        overflow-wrap: anywhere;
      }

      .row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .rowhead {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        font-size: 12px;
      }

      /*
       * Small's rows are the whole card, so they are set one step down — 11 px
       * is what makes `7-day (all models)` and `100%` fit side by side at the
       * system mono font in the narrowest `CARD_WIDTH`.
       *
       * Small alone still ellipsises the Codex credit-limit row, and is meant
       * to: see the width table in `core/card-layout.ts`, which carries the
       * budget arithmetic this padding and this font size feed into.
       */
      #card[data-size='small'] .rowhead {
        font-size: 11px;
      }

      /*
       * Large alone prints the credit counts inside the money value
       * (`formatMoneyValue(…, showCredits)`), which makes that value about as
       * wide as the whole row — and because `.value` is `flex: none` and
       * `.label` ellipsises, the label was squeezed to `Codex…` (QA row 4.24,
       * 0.2.8). So at Large the row may wrap: a value that does not fit beside
       * its label drops to its own line, pushed right by `margin-left: auto`,
       * and the label keeps the whole first line. A row that does fit side by
       * side is unchanged. `max-width: 100%` caps a value longer than the row
       * itself at the row, so its text wraps inside it (right-aligned) instead
       * of spilling past the card edge. Medium and Small never show the counts
       * and keep the one-line layout.
       */
      #card[data-size='large'] .rowhead {
        flex-wrap: wrap;
      }

      #card[data-size='large'] .value {
        margin-left: auto;
        max-width: 100%;
        text-align: right;
      }

      .label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .value {
        font-size: 11px;
        font-weight: 700;
        color: var(--pct);
        flex: none;
      }

      /*
       * The "(shared pool)" note on a derived row — see `bucketRow` in
       * `panel.ts`. Deliberately quiet: a footnote on the label rather than a
       * second label, so it takes the muted ink and the smaller size the
       * `resets` line already uses.
       */
      .shared {
        font-size: 9px;
        color: var(--muted);
      }

      /* 20 discrete segments — the pixel-art bar from the design. */
      .seg {
        display: grid;
        grid-template-columns: repeat(20, minmax(0, 1fr));
        gap: 2px;
        height: 10px;
      }

      .seg div {
        background: var(--empty);
        border: 1px solid var(--ink);
      }

      .seg div.on-low {
        background: var(--green);
      }
      .seg div.on-mid {
        background: var(--amber);
      }
      .seg div.on-high {
        background: var(--red);
      }
      .seg div.on-unknown {
        background: var(--unknown);
      }

      .resets {
        font-size: 10px;
        color: var(--muted);
      }

      /*
       * The age footer Medium and Small grow when — and only when — the age is
       * a problem (`compactFooter` in `core/card-layout.ts`). Muted and small:
       * it is a caveat about the numbers above it, not a number of its own.
       */
      .foot {
        font-size: 10px;
        color: var(--muted);
      }

      .stale {
        color: var(--stale);
      }
    </style>
  </head>
  <body>
    <!-- A landmark, so a reader can find the numbers rather than walking the
         whole window: this card is the only content there is. -->
    <div id="card" role="region" aria-label="Walder usage"></div>
    <script type="module" src="./panel.ts"></script>
  </body>
</html>
